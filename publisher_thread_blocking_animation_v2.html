<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publisher Thread Blocking Animation</title>
<style>
  body { font-family: sans-serif; background: #fff; color: #1a1a1a; padding: 24px; max-width: 800px; margin: 0 auto; }
  .mode-btn { padding: 6px 16px; font-size: 13px; border-radius: 8px; border: 0.5px solid #ccc; background: transparent; color: #555; cursor: pointer; transition: all .15s; }
  .mode-btn.active { background: #e6f1fb; color: #0c447c; border-color: #378add; }
  .lane-label { font-size: 12px; font-weight: 500; color: #555; width: 110px; flex-shrink: 0; padding-top: 10px; }
  .lane { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .track { flex: 1; height: 36px; background: #f5f5f2; border-radius: 8px; border: 0.5px solid #ddd; position: relative; }
  .bar { position: absolute; top: 4px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; white-space: nowrap; padding: 0 8px; transition: none; overflow: hidden; box-sizing: border-box; }
  .bar-teal   { background: #E1F5EE; border: 0.5px solid #0F6E56; color: #085041; }
  .bar-purple { background: #EEEDFE; border: 0.5px solid #534AB7; color: #3C3489; }
  .bar-wait   { background: #fef9ec; border: 0.5px solid #d4a000; color: #7a5800; }
  .bar-done   { background: #eaf3de; border: 0.5px solid #3B6D11; color: #27500A; }
  .tick-row { display: flex; margin-left: 120px; margin-bottom: 4px; }
  .tick { flex: 1; font-size: 11px; color: #aaa; text-align: center; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
  .leg { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #555; }
  .leg-dot { width: 12px; height: 12px; border-radius: 3px; }
</style>
</head>
<body>

<div style="display:flex; gap:8px; margin-bottom:20px;">
  <button class="mode-btn active" id="btn-sync" onclick="setMode('sync')">기본 (동기)</button>
  <button class="mode-btn" id="btn-async" onclick="setMode('async')">@Async 적용</button>
</div>

<div class="tick-row" id="ticks"></div>

<div class="lane">
  <div class="lane-label">Publisher<br><span style="font-weight:400;color:#aaa;font-size:11px;">HTTP 요청 스레드</span></div>
  <div class="track" id="track-pub"></div>
</div>
<div class="lane">
  <div class="lane-label">Listener<br><span style="font-weight:400;color:#aaa;font-size:11px;">이메일 발송</span></div>
  <div class="track" id="track-lst"></div>
</div>
<div class="lane" id="lane-pool" style="display:none;">
  <div class="lane-label">스레드풀<br><span style="font-weight:400;color:#aaa;font-size:11px;">@Async 워커</span></div>
  <div class="track" id="track-pool"></div>
</div>

<div style="margin-top:16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
  <button class="mode-btn" onclick="startAnim()" style="padding:6px 20px;">다시 재생</button>
  <div class="legend">
    <div class="leg"><div class="leg-dot bar-teal"></div>비즈니스 로직</div>
    <div class="leg"><div class="leg-dot bar-wait"></div>대기 (블로킹)</div>
    <div class="leg"><div class="leg-dot bar-purple"></div>리스너 실행</div>
    <div class="leg"><div class="leg-dot bar-done"></div>완료</div>
  </div>
</div>

<div id="desc" style="margin-top:16px; font-size:13px; color:#555; min-height:36px; line-height:1.6;"></div>

<script>
const TOTAL = 10;
let mode = 'sync';
let raf = null;
let startTime = null;

const SYNC_FRAMES = [
  { lane:'pub', start:0,   end:2.5, cls:'bar-teal',   label:'비즈니스 로직' },
  { lane:'pub', start:2.5, end:4,   cls:'bar-teal',   label:'event()' },
  { lane:'pub', start:4,   end:7,   cls:'bar-wait',   label:'대기 중 (블로킹)' },
  { lane:'lst', start:4,   end:7,   cls:'bar-purple', label:'이메일 발송' },
  { lane:'pub', start:7,   end:9,   cls:'bar-teal',   label:'응답 반환' },
  { lane:'pub', start:9,   end:10,  cls:'bar-done',   label:'완료' },
];

const ASYNC_FRAMES = [
  { lane:'pub',  start:0,   end:2.5, cls:'bar-teal',   label:'비즈니스 로직' },
  { lane:'pub',  start:2.5, end:4,   cls:'bar-teal',   label:'event()' },
  { lane:'lst',  start:4,   end:5,   cls:'bar-purple', label:'스레드풀 위임' },
  { lane:'pool', start:5,   end:8,   cls:'bar-purple', label:'이메일 발송 (별도 스레드)' },
  { lane:'pub',  start:4,   end:6,   cls:'bar-teal',   label:'응답 반환' },
  { lane:'pub',  start:6,   end:6.8, cls:'bar-done',   label:'완료' },
];

const SYNC_MSGS = [
  [0,   '서비스 메서드가 실행됩니다.'],
  [2.5, 'event() 호출 — 리스너에게 이벤트를 전달합니다.'],
  [4,   '리스너(이메일 발송)가 같은 스레드에서 실행 중입니다. Publisher는 기다립니다.'],
  [7,   '리스너 완료 — Publisher 스레드가 다시 진행합니다.'],
  [9,   '응답 반환 완료. 총 소요시간이 리스너 실행시간만큼 늘어납니다.'],
];

const ASYNC_MSGS = [
  [0,   '서비스 메서드가 실행됩니다.'],
  [2.5, 'event() 호출 — 리스너에게 이벤트를 전달합니다.'],
  [4,   '리스너가 호출되지만, @Async이므로 스레드풀에 작업을 위임합니다.'],
  [5,   'Publisher 스레드는 즉시 다음 코드로 진행합니다. 블로킹 없음.'],
  [6,   'Publisher는 이미 응답 반환 완료. 이메일 발송은 별도 스레드에서 계속 실행 중.'],
  [8,   '리스너 완료. Publisher와 무관하게 끝납니다.'],
];

function pct(v) { return (v / TOTAL * 100).toFixed(2) + '%'; }
function w(s, e) { return ((e - s) / TOTAL * 100).toFixed(2) + '%'; }

function setMode(m) {
  mode = m;
  document.getElementById('btn-sync').classList.toggle('active', m === 'sync');
  document.getElementById('btn-async').classList.toggle('active', m === 'async');
  document.getElementById('lane-pool').style.display = m === 'async' ? 'flex' : 'none';
  startAnim();
}

function clearTracks() {
  ['pub','lst','pool'].forEach(id => {
    document.getElementById('track-' + id).innerHTML = '';
  });
  document.getElementById('desc').textContent = '';
}

function buildTicks() {
  const row = document.getElementById('ticks');
  row.innerHTML = '';
  for (let i = 0; i <= TOTAL; i++) {
    const t = document.createElement('div');
    t.className = 'tick';
    t.textContent = i === 0 ? '0s' : i % 2 === 0 ? i + 's' : '';
    row.appendChild(t);
  }
}

function startAnim() {
  if (raf) cancelAnimationFrame(raf);
  clearTracks();
  buildTicks();
  startTime = null;
  const frames = mode === 'sync' ? SYNC_FRAMES : ASYNC_FRAMES;
  const msgs   = mode === 'sync' ? SYNC_MSGS   : ASYNC_MSGS;
  const bars = {};

  function step(ts) {
    if (!startTime) startTime = ts;
    const elapsed = Math.min((ts - startTime) / 800, TOTAL);

    frames.forEach((f, i) => {
      const key = i;
      const visible = elapsed >= f.start;
      const endClamped = Math.min(elapsed, f.end);
      if (!visible) return;
      const track = document.getElementById('track-' + f.lane);
      if (!track) return;
      if (!bars[key]) {
        const el = document.createElement('div');
        el.className = 'bar ' + f.cls;
        el.style.left = pct(f.start);
        el.style.width = '0%';
        el.textContent = f.label;
        track.appendChild(el);
        bars[key] = el;
      }
      bars[key].style.width = w(f.start, endClamped);
    });

    let lastMsg = '';
    msgs.forEach(([t, m]) => { if (elapsed >= t) lastMsg = m; });
    document.getElementById('desc').textContent = lastMsg;

    if (elapsed < TOTAL) raf = requestAnimationFrame(step);
  }

  raf = requestAnimationFrame(step);
}

startAnim();
</script>
</body>
</html>
